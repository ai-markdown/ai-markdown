name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository; the default GITHUB_TOKEN grant is wider.
permissions:
  contents: read

# Cancel any in-progress run on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: /preview/
      DOCS_SITE_URL: https://docs.example.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm build:docs
      - run: pnpm test:docs
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: apps/docs/dist/

  consumer-compat:
    uses: ./.github/workflows/consumer-compat.yml

  soak-impact:
    name: Assess engine soak impact
    timeout-minutes: 15
    outputs:
      required: ${{ steps.impact.outputs.required }}
      smoke_required: ${{ steps.impact.outputs.smoke_required }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Report the candidate's cumulative impact since the preceding train tag.
      # Tool changes run bounded smoke; full campaigns stay local.
      - name: Report engine soak requirement
        id: impact
        run: pnpm check:soak-impact
      - name: Build engine workspace dependencies
        if: steps.impact.outputs.smoke_required == 'true'
        run: pnpm --filter '@ai-markdown/engine...' build
      - name: Verify soak toolchain (bounded six-leg smoke)
        if: steps.impact.outputs.smoke_required == 'true'
        run: pnpm test:soak-smoke
      - name: Upload soak smoke reports
        if: always() && steps.impact.outputs.smoke_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-soak-smoke
          path: .soak-logs/toolchain-smoke-*/
          include-hidden-files: true
          retention-days: 7

  soak-status:
    name: >-
      ${{ needs.soak-impact.result != 'success' && '⚠ Engine soak assessment or smoke FAILED' ||
          needs.soak-impact.outputs.required == 'true' && '⚠ Engine soak FULL required before release' ||
          needs.soak-impact.outputs.smoke_required == 'true' && '✓ Engine soak SMOKE verified' ||
          needs.soak-impact.outputs.required == 'false' && '✓ Engine soak NOT REQUIRED' ||
          '⚠ Engine soak assessment UNAVAILABLE' }}
    needs: soak-impact
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SOAK_REQUIRED: ${{ needs.soak-impact.outputs.required }}
      SOAK_SMOKE: ${{ needs.soak-impact.outputs.smoke_required }}
      ASSESSMENT_RESULT: ${{ needs.soak-impact.result }}
    steps:
      - name: Surface decision in the PR check list
        run: |
          if [ "$ASSESSMENT_RESULT" != success ]; then
            echo "::error::Engine soak assessment or bounded smoke failed."; exit 1
          fi
          if [ "$SOAK_SMOKE" = true ]; then
            echo "Bounded six-leg toolchain smoke passed. This is not full release-profile evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$SOAK_REQUIRED" in
            true) echo "Full engine soak is REQUIRED before release. This successful reporting check is not soak evidence. Complete the local release profile and approve the release gate." >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo "Full engine soak is NOT REQUIRED for the assessed range. Release CI reassesses the final candidate." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Engine soak assessment is unavailable; do not infer that soak is unnecessary."; exit 1 ;;
          esac

  ci:
    name: ${{ matrix.task }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pinned to the EXACT patch as determinism insurance. NOTE the v2.8.0
        # release failure this pin was written for was NOT node drift: measured
        # on a single node (22.23.1), the corpus fingerprint flips 1cf2847b ↔
        # e0f0d77a with the fuzzGenerators.ts edit in the type-7 sticky-residue fix alone. The real
        # rule lives in boundaryDiff.test.ts: any change to fuzzGenerators.ts
        # or pinnedCorpus.ts must regenerate boundaryBaseline.json in the SAME
        # commit.
        #
        # This comment used to end "(node 24 does drift the fast-check stream
        # — keep the pin.)" Measured 2026-09-03 on 22.23.2 vs 24.20.0: it does
        # not. Four document arbitraries hash identically at a fixed seed, and
        # boundaryDiff passes against its committed baseline on both — see
        # `streamdrift.evidence.ts`. Keep the pin anyway, for the reason on
        # the first line: one runtime everywhere is one less variable when a
        # gate reddens. Do not keep the old reason.
        node: ['22.23.2']
        task:
          - lint
          - format-check
          - typecheck
          - test
          - build
          - browser-smoke
          - core-contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/setup (not pnpm/action-setup, which stops at pnpm 10) installs
      # pnpm and the Node runtime in one step. The pnpm version comes from
      # `packageManager` in package.json; `install: false` keeps the explicit
      # frozen-lockfile step below, so a lockfile drift fails loudly here
      # rather than inside the action.
      - name: Setup pnpm + Node ${{ matrix.node }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Overrides live ONLY in pnpm-workspace.yaml (pnpm 11); this asserts
      # the lockfile recorded the same rules — a stale lockfile means the
      # rules people believe are in force are not the ones that resolved
      # the tree. (A package.json#pnpm copy is rejected by the script.)
      - name: Overrides in sync
        if: matrix.task == 'lint'
        run: pnpm check:overrides

      - name: Lint
        if: matrix.task == 'lint'
        run: pnpm lint

      - name: Format check
        if: matrix.task == 'format-check'
        run: pnpm format:check

      # Workspace packages resolve each other through exports maps that point
      # at dist/ — absent on a fresh checkout since matrix tasks run in
      # isolated jobs.
      #
      # EVERY publishable package, not just core and what core depends on.
      # `@ai-markdown/react...` walks core's dependencies DOWNWARD, and
      # mantine is not one — it depends on core, not the other way round. The
      # `react-mantine` benchmark app imports `@ai-markdown/react-mantine`,
      # which resolves through its `exports` to a `dist` nothing had built, so
      # `pnpm -r typecheck` failed on a module-not-found that no local run
      # reproduces (a developer has the dist from an earlier build). CI went
      # red the day the benchmark apps landed and stayed red for six runs.
      - name: Build all packages (dependents resolve dist)
        if: matrix.task == 'typecheck' || matrix.task == 'test' || matrix.task == 'browser-smoke'
        run: pnpm build

      - name: Typecheck (all packages)
        if: matrix.task == 'typecheck'
        run: pnpm typecheck:packages

      # `pnpm -r` skips the workspace root, so the root script — the only
      # gate covering apps/storybook-* and packages/*/stories — must run
      # explicitly. It also resolves core through dist, built above.
      - name: Typecheck (storybook + stories)
        if: matrix.task == 'typecheck'
        run: pnpm typecheck:storybook

      - name: Development command control
        if: matrix.task == 'test'
        run: pnpm test:command-control

      - name: Soak control tests
        if: matrix.task == 'test'
        run: pnpm test:soak-control

      - name: Release authentication boundary
        if: matrix.task == 'test'
        run: pnpm test:release-control

      - name: Core independent contracts and state sequences
        if: matrix.task == 'core-contracts'
        run: pnpm test:core-contracts

      - name: Test (all packages)
        if: matrix.task == 'test'
        run: pnpm test:unit

      - name: Build (all packages)
        if: matrix.task == 'build'
        run: pnpm build

      # Publish-surface gate: attw resolves every exports-map entrypoint under
      # node10/node16/bundler rules against the packed tarball, publint lints
      # the manifest — locks the dual-format exports pattern that was
      # previously only hand-validated.
      - name: Package export checks (attw + publint)
        if: matrix.task == 'build'
        run: pnpm packcheck

      - name: Public API declarations
        if: matrix.task == 'build'
        run: pnpm check:public-api

      - name: Packed consumers outside workspace
        if: matrix.task == 'build'
        run: pnpm test:packed-consumers

      # The root vitest config's framework Storybook projects render every story in
      # headless Chromium (via @storybook/addon-vitest) — the only gate that
      # exercises real browser DOM. `pnpm -r test` never reaches it because
      # the project lives at the workspace root, so it gets its own task.
      - name: Install Playwright browsers
        if: matrix.task == 'browser-smoke'
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Browser smokes (storybook stories)
        if: matrix.task == 'browser-smoke'
        run: pnpm test:storybook

      - name: Build and verify composed Storybook site
        if: matrix.task == 'browser-smoke'
        run: |
          STORYBOOK_DOCS_EXPORT=1 pnpm build:storybook --skip-build
          pnpm test:storybook:site
          pnpm test:storybook:dev

      - name: Concurrent document scope lifetime
        if: matrix.task == 'browser-smoke'
        run: pnpm test:document-lifetime

      - name: Vue browser adapter contracts
        if: matrix.task == 'browser-smoke'
        run: |
          pnpm test:vue-browser
          pnpm test:vue-browser:compat
