name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-environment:
    if: github.repository == 'ai-markdown/ai-markdown.github.io' || github.event_name == 'pull_request'
    uses: ./.github/workflows/browser-environment.yml
    with:
      repository: ai-markdown/ai-markdown
      ref: ${{ github.repository == 'ai-markdown/ai-markdown' && github.sha || 'main' }}

  build:
    # Only the organization site publishes content; PRs still validate builds.
    if: github.repository == 'ai-markdown/ai-markdown.github.io' || github.event_name == 'pull_request'
    needs: browser-environment
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.browser-environment.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ai-markdown/ai-markdown
          ref: ${{ needs.browser-environment.outputs.revision }}
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure documentation URLs
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "DOCS_SITE_URL=$PAGES_ORIGIN" >> "$GITHUB_ENV"
          echo "DOCS_BASE=${PAGES_BASE%/}/" >> "$GITHUB_ENV"
          echo "DOCS_STORYBOOK_URL=$PAGES_ORIGIN${PAGES_BASE%/}/storybook/" >> "$GITHUB_ENV"
      - run: pnpm check:docs
      - run: pnpm build:docs
      - name: Build all Storybook catalogs
        run: STORYBOOK_DOCS_EXPORT=1 pnpm build:storybook
      - run: pnpm test:storybook:site
      - run: pnpm assemble:pages
      - name: Check assembled documentation and example links
        run: DOCS_DIST=_site pnpm test:docs
      - name: Record published source
        run: |
          git rev-parse HEAD > _site/source-commit.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository == 'ai-markdown/ai-markdown.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined site
        id: deployment
        uses: actions/deploy-pages@v5

  # The organization site is built and deployed by ai-markdown.github.io. Its
  # own schedule can run hours late, so a push here starts that workflow
  # directly. Needs SITE_PUBLISH_TOKEN, a token allowed to run workflows in
  # that repository; without it the step is skipped and the schedule remains
  # the only trigger.
  publish-site:
    if: github.repository == 'ai-markdown/ai-markdown' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start the organization site workflow
        env:
          GH_TOKEN: ${{ secrets.SITE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::notice::SITE_PUBLISH_TOKEN is not set; the site will publish on its schedule.'
            exit 0
          fi
          gh workflow run publish.yml --repo ai-markdown/ai-markdown.github.io --ref main

  project-redirect:
    if: github.repository == 'ai-markdown/ai-markdown' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Verify compatibility redirects
        run: node --test scripts/build-pages-redirect.test.mjs
      - name: Redirect legacy project URLs to the canonical website
        run: node scripts/build-pages-redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
