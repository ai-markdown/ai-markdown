name: Browser benchmark

# MANUAL ONLY. Nothing triggers this job; it runs when someone dispatches it.
#
# It used to also run on `v*` tags, to collect a baseline per release "until
# there is enough data to say what a real regression looks like". That plan
# was removed on 2026-09-03 rather than repaired, because it never started:
#
#   4 runs, 0 successes. Three tag runs failed at ~5 min on a leaked preview
#   server (fixed since, in `ec065c7`, and never re-verified because no tag
#   has been pushed). One manual run was killed by the 120-minute cap at
#   40 of 84 cells, with react-mantine not yet started. Zero baselines were
#   ever collected, so the argument that they would eventually add up to a
#   threshold never got a chance to be right or wrong.
#
# The cap was not the whole story either, and the ledger entry that blamed it
# on the `scale-*` cells was wrong: at the measured per-cell costs a full
# pass is ~161 min, of which the three scale families are 68 and the sixteen
# original scenarios are 93. The job had simply grown from the 39 cells this
# file's timeout was calibrated against to 84, with nothing connecting the
# two — `run.mjs` reads the scenario list from the BUILT APP, so adding a
# scenario enlarges the CI job without the author ever seeing the budget.
#
# There is a second, worse problem, and it is why this is being switched off
# rather than re-budgeted. The cells whose names read like real usage are the
# ones that cannot see a regression. Measured 2026-08-30 and recorded in
# `kit/src/scenarios.ts`: `code-dense` at 16 ms/chunk takes 21.2 s
# unthrottled and 20.6 s under a verified 4x CPU throttle, because the
# schedule is the bound, not the renderer. That is true of all seven
# timer-paced scenarios. `smoothStream` is not exercised by any scenario at
# all.
#
# The suite has earned its keep as an INVESTIGATION instrument — it falsified
# the "Safari smoothStream is chunky" report as a dev-server artifact, and it
# produced the per-update floor finding on the scale axis. Those were local
# runs by a person asking a specific question, which is what `pnpm bench:web`
# is still for. It has earned nothing as an unattended collector.
#
# Owner's call, 2026-09-03: leave it off, revisit the whole system after the
# corpus work. Do not re-add a trigger without deciding what the numbers
# would gate.
#
# The self-test step below still fails a dispatched run, and it is the one
# part of this file with teeth: it asserts the INSTRUMENT rather than the
# renderer — that injected main-thread work of a known size shows up in the
# metrics — and its assertions are arithmetic rather than thresholds, so
# runner speed does not move them. It is the obvious candidate if this ever
# comes back to CI in some smaller form; it is not there today, because
# gating releases on a subsystem whose design is under review is how a
# release gets blocked by a decision nobody has made yet.
#
# `pnpm bench:web:selftest` runs it locally in the meantime.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per cell
        required: false
        default: '3'
      throttle:
        description: CPU throttle multiplier (1 = none; 4 is the comparison setting)
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  browser-environment:
    uses: ./.github/workflows/browser-environment.yml

  benchmark:
    needs: browser-environment
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.browser-environment.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    # Measured from the run that got killed at the old 120: per-cell costs
    # across the 40 cells it completed project to ~161 min for all 84, at
    # three repeats plus a warm-up each. 240 clears that with margin on a
    # runner 2-3x slower than a laptop.
    #
    # This only ever spends runner minutes when someone dispatches the job.
    # Leaving the cap at 120 would have left a manual button that cannot
    # finish, which is a worse thing to leave behind than a slow one.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # pnpm/setup (not pnpm/action-setup, which stops at pnpm 10) installs
      # the pnpm 11 pinned by `packageManager` and the same exact Node as
      # ci.yml. Not for determinism of the numbers — they are not
      # deterministic — but so that a baseline recorded here is at least
      # comparable to the next one.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - name: Prepare container ownership
        run: |
          # Firefox requires HOME to belong to the running user. GitHub mounts
          # this directory with the host uid, while the test container uses root.
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Verify browser environment
        timeout-minutes: 2
        run: node scripts/ci/check-browsers.mjs chromium

      - name: Record the environment
        # `compare.mjs` guards the throttle, and nothing else. A CI artifact
        # and a laptop run differ by refresh rate, CPU and Chromium build,
        # any of which reads as a 2x regression to someone comparing them.
        # Recorded beside the results so that mistake is at least visible.
        run: |
          {
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "node=$(node -v)"
            echo "chromium=$(pnpm exec playwright --version)"
            nproc | sed 's/^/cpus=/'
          } | tee benchmarks/results-env.txt

      - name: Build the packages the apps consume
        # The apps resolve `@ai-markdown/*` through `exports` to `dist`,
        # exactly as a user's install would. Without this they would resolve
        # to nothing.
        run: pnpm build

      - name: Self-test the harness
        # Runs first and fails the job: every number below is worthless if the
        # instrument is not observing.
        run: pnpm bench:web:selftest

      - name: Collect baselines (throttled)
        # THROTTLED, because 1x on a runner collects the useless kind of
        # honest number: the first unthrottled baseline had zero long tasks
        # and zero blocking time in 12 of 14 cells, with every frame p95
        # within a millisecond of the display floor. Ninety days of artifacts
        # in which nothing can move is worse than none.
        #
        # Through env, not interpolated into the command line. `inputs` is
        # only settable by someone who can already dispatch this workflow, so
        # this is hygiene rather than a live hole — but a run: line that
        # splices `${{ }}` into a shell string is the shape to never get in
        # the habit of writing.
        env:
          REPEATS: ${{ inputs.repeats || '3' }}
          THROTTLE: ${{ inputs.throttle || '4' }}
        run: pnpm bench:web --repeats "$REPEATS" --throttle "$THROTTLE"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmarks/results/*.json
            benchmarks/results-env.txt
          if-no-files-found: error
          retention-days: 90
