name: Release

# Publishes the five train packages and the independently versioned packages to npm with provenance attestation when a version
# tag is pushed. Flow:
#
#   pnpm version-packages X.Y.Z && pnpm install
#   git commit -am "chore(release): vX.Y.Z"
#   git tag vX.Y.Z && git push origin main vX.Y.Z
#
# Independent (non-lockstep) packages — @ai-markdown/remark-mark-highlight
# and @ai-markdown/code-language-detector, listed in
# scripts/release-packages.mjs — ride a train tag automatically
# when their version was bumped (the publisher skips already-published
# versions). To release ONE of them without a train, push a package tag:
#
#   git tag remark-mark-highlight-vX.Y.Z && git push origin remark-mark-highlight-vX.Y.Z
#
# The steps below detect the tag shape: package tags verify against that
# package's package.json, publish with --filter, and use auto-generated
# release notes.
#
# Auth is npm "trusted publishing" (OIDC): register this repo+workflow
# as a trusted publisher for each package on npmjs.com. A package that does
# not exist on npm yet has no trusted publisher to register, so its first
# version bootstraps with FIRST_PUBLISH_NPM_TOKEN (Vue at v3.0.0-beta.2, the
# language detector at code-language-detector-v1.0.0); later tags use only OIDC.
# npm mints a short-lived credential from the id-token
# permission below, and provenance is attached automatically. pnpm's own
# native OIDC support landed in 11.1.3, below the version pinned here, so the
# workflow-wide pnpm publishes directly — no npx side-channel.

on:
  workflow_dispatch:
    inputs:
      bootstrap_vue:
        description: Use the temporary token only for the first Vue package publication
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to finish without republishing existing versions
        required: true
        default: v3.0.0-beta.1
        type: string
  push:
    tags:
      - 'v*'
      - '*-v*'

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

# Default for every job is read-only. The `release` job alone raises this to
# `contents: write` (GitHub release) and `id-token: write` (OIDC for npm
# trusted publishing + provenance); `verify` and the called consumer-compat
# workflow only check out and build.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  consumer-compat:
    uses: ./.github/workflows/consumer-compat.yml

  verify:
    name: Verify release
    outputs:
      soak_required: ${{ steps.soak.outputs.required }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm/setup (not pnpm/action-setup, which stops at pnpm 10) installs
      # pnpm and Node in one step, taking the pnpm version from
      # `packageManager`. No registry-url equivalent is configured anywhere:
      # with trusted publishing there is no auth token, and writing an .npmrc
      # with an unresolved ${NODE_AUTH_TOKEN} placeholder would interfere with
      # the OIDC flow.
      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full campaigns run locally; required impact gates publication on human review.
      - name: Assess engine soak requirement
        id: soak
        run: pnpm check:soak-impact

      - name: Verify tag matches package version
        run: node scripts/check-release.mjs "$RELEASE_TAG"

      - name: Verify recovery uses the tagged package sources
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git diff --exit-code "$RELEASE_TAG" -- packages pnpm-lock.yaml pnpm-workspace.yaml package.json

      # Full quality gate — mirrors CI so a tag can't ship anything main
      # wouldn't accept. Build runs first: mantine's typecheck/tests resolve
      # @ai-markdown/react through its exports map, which points at dist/.
      - name: Overrides in sync
        run: pnpm check:overrides

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Verify soak toolchain (bounded six-leg smoke)
        if: steps.soak.outputs.smoke_required == 'true'
        timeout-minutes: 15
        run: pnpm test:soak-smoke
      - name: Upload soak smoke reports
        if: always() && steps.soak.outputs.smoke_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-soak-smoke
          path: .soak-logs/toolchain-smoke-*/
          include-hidden-files: true
          retention-days: 7

      # Publish-surface gate, mirroring CI's build task: exports-map
      # resolution (attw) + manifest lint (publint) on the packed tarballs.
      - name: Package export checks (attw + publint)
        run: pnpm packcheck

      - name: Public API declarations
        run: pnpm check:public-api

      - name: Packed consumers outside workspace
        run: pnpm test:packed-consumers

      - name: Typecheck
        run: pnpm typecheck:packages

      # `pnpm -r` skips the workspace root — the root script is the only
      # gate covering apps/storybook-* and packages/*/stories (same split as CI).
      - name: Typecheck (storybook + stories)
        run: pnpm typecheck:storybook

      # Per-package unit suites, matching the CI gate.
      - name: Development command control
        run: pnpm test:command-control

      - name: Soak control tests
        run: pnpm test:soak-control

      - name: Release authentication boundary
        run: pnpm test:release-control

      - name: Test
        run: pnpm test:unit

      # Browser smokes, matching CI's browser-smoke task: the root vitest
      # config's framework Storybook projects render every story in headless Chromium.
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps

      - name: Browser smokes (storybook stories)
        run: pnpm test:storybook

      - name: Build and verify composed Storybook site
        run: |
          STORYBOOK_DOCS_EXPORT=1 pnpm build:storybook --skip-build
          pnpm test:storybook:site
          pnpm test:storybook:dev

      - name: Concurrent document scope lifetime
        run: pnpm test:document-lifetime

      - name: Vue browser adapter contracts
        run: |
          pnpm test:vue-browser
          pnpm test:vue-browser:compat

  soak-approval:
    name: Confirm local engine soak passed
    needs: verify
    if: needs.verify.outputs.soak_required == 'true'
    runs-on: ubuntu-latest
    environment: soak-approval
    permissions: {}
    steps:
      - name: Record confirmation
        run: echo "Maintainer approved local release-profile soak evidence for this candidate." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish verified release
    needs: [verify, consumer-compat, soak-approval]
    if: >-
      always() && !cancelled() && needs.verify.result == 'success' && needs.consumer-compat.result == 'success' &&
      ((needs.verify.outputs.soak_required == 'false' && needs.soak-approval.result == 'skipped') ||
       (needs.verify.outputs.soak_required == 'true' && needs.soak-approval.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - name: Checkout verified workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build verified sources
        run: pnpm build

      # pnpm delegates the actual upload to the npm CLI, and the OIDC token
      # exchange happens there — npm 10.x (bundled with Node 22) predates
      # trusted publishing and dies with ENEEDAUTH.
      - name: Upgrade npm (OIDC exchange needs ≥ 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      # A pre-release version (`x.y.z-beta.1` — the version script and the
      # tag filter both accept it) must not take over the `latest` dist-tag:
      # npm gives every publish `latest` unless told otherwise (2026-08-19
      # review r2 P2-16). The dist-tag is the pre-release identifier's first
      # word (`beta.1` → `beta`, `rc.2` → `rc`), `next` when it has none.
      # The beta.2 tag created Vue, and code-language-detector-v1.0.0 creates
      # the language detector. Only the package being created receives the
      # temporary token; existing packages retain their OIDC publishers.
      - name: Publish to npm (provenance; first beta token or OIDC)
        env:
          FIRST_PUBLISH_NPM_TOKEN: ${{ (inputs.bootstrap_vue || (inputs.release_tag || github.ref_name) == 'v3.0.0-beta.1' || (inputs.release_tag || github.ref_name) == 'v3.0.0-beta.2' || (inputs.release_tag || github.ref_name) == 'code-language-detector-v1.0.0') && secrets.FIRST_PUBLISH_NPM_TOKEN || '' }}
          FIRST_PUBLISH_PACKAGE: ${{ (inputs.bootstrap_vue || (inputs.release_tag || github.ref_name) == 'v3.0.0-beta.2') && '@ai-markdown/vue' || (inputs.release_tag || github.ref_name) == 'code-language-detector-v1.0.0' && '@ai-markdown/code-language-detector' || '' }}
        run: |
          node scripts/publish-packages.mjs "$RELEASE_TAG"

      - name: Verify published npm artifacts and consumers
        run: pnpm test:published-release "$RELEASE_TAG" "$RUNNER_TEMP/published-release"

      - name: Archive published package verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-release-verification
          path: ${{ runner.temp }}/published-release
          if-no-files-found: ignore

      # Notes come from the version's section in apps/docs/content/guides/release-highlights.md —
      # the hand-written changelog — falling back to GitHub's auto-generated
      # notes if no section exists for this version.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "GitHub release already exists; published verification completed."
            exit 0
          fi
          if [ "${RELEASE_TAG#v}" = "$RELEASE_TAG" ]; then
            # Package tag — no release-highlights section; auto-generate notes.
            PACKAGE_VERSION="${RELEASE_TAG##*-v}"
            PACKAGE_RELEASE_ARGS=()
            case "$PACKAGE_VERSION" in *-*) PACKAGE_RELEASE_ARGS=(--prerelease --latest=false);; esac
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag "${PACKAGE_RELEASE_ARGS[@]}"
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          RELEASE_ARGS=()
          case "$VERSION" in *-*) RELEASE_ARGS=(--prerelease --latest=false);; esac
          # A `### <version>` heading followed by a space (title) or by end
          # of line; the section runs to the next `### `. If the same version
          # has more than one section, only the first is used — warn so the
          # truncation is visible in the job log rather than discovered on
          # the release page.
          SECTIONS="$(grep -cE "^### ${VERSION//./\\.}( |$)" apps/docs/content/guides/release-highlights.md || true)"
          awk -v ver="$VERSION" '
            index($0, "### " ver " ") == 1 || $0 == "### " ver { found = 1; next }
            found && /^### / { exit }
            found { print }
          ' apps/docs/content/guides/release-highlights.md > /tmp/release-notes.md
          if [ "$SECTIONS" -gt 1 ]; then
            echo "::warning::apps/docs/content/guides/release-highlights.md has ${SECTIONS} sections for ${VERSION}; only the first is used as release notes"
          fi
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md --verify-tag "${RELEASE_ARGS[@]}"
          else
            echo "::warning::No '### ${VERSION}' section in apps/docs/content/guides/release-highlights.md — falling back to auto-generated release notes"
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag "${RELEASE_ARGS[@]}"
          fi
