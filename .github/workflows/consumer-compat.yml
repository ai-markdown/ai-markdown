name: Packed consumer compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The build toolchain needs a newer Node than the packages' declared lower
  # bounds, so the packages are built once here and the matrix below only
  # packs and consumes that output.
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22.23.2
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: consumer-compat-dist
          # Stored relative to `packages/`, the common parent of the matches.
          path: packages/*/dist/
          if-no-files-found: error
          retention-days: 1

  consumers:
    name: Packed consumers (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both declared lower bounds and the current Node 24 line.
        # Older Node releases cannot require the ESM dependencies in CJS output.
        node: ['20.19.0', '22.12.0', '24.20.0']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: consumer-compat-dist
          path: packages
      - run: pnpm test:packed-consumers
