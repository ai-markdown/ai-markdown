packages:
  - 'packages/*'
  - 'apps/storybook-*'
  - 'apps/docs'
  - 'tooling/storybook-kit'
  # Benchmark apps and their kit. All private, none published. They are in the
  # workspace so they resolve `@ai-markdown/*` through the same `exports`
  # a user gets from npm — a benchmark that imported our `src` would measure a
  # build no one ships. `build`/`packcheck` filter `./packages/*`, so these do
  # not join either; `pnpm -r typecheck` DOES pick them up, deliberately: an
  # app that mirrors the README integration is also a smoke test that the
  # README integration still typechecks.
  - 'prototypes/*'
  - 'corpus'
  - 'benchmarks/kit'
  - 'benchmarks/react-*'

# Dependency install scripts, allowed one by one (pnpm 11 replaced
# onlyBuiltDependencies / neverBuiltDependencies / ignoredBuiltDependencies
# with this single map). Both entries are `false` because neither script is
# needed: modern esbuild ships per-platform binaries as optionalDependencies
# rather than fetching them in a postinstall, and @parcel/watcher — an
# optional transitive of sass — ships prebuilds too. This repo never had a
# built-dependencies allowlist under pnpm 10 either, so these scripts have
# always been skipped, across every green build to date. Flip one to `true`
# only with evidence that its absence broke something.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false

# Our own fork chain (see the 2.5.5 release notes). ANTICIPATORY config: no
# `minimumReleaseAge` is set anywhere, so this exclude list is currently a
# no-op — it exists so that if a cooldown is ever enabled, freshly published
# fork versions stay installable the day they are cut. (The active cooldown
# is Dependabot's, a separate mechanism.)
minimumReleaseAgeExclude:
  - '@ai-markdown/hast-util-from-parse5@8.0.5'
  - '@ai-markdown/hast-util-raw@9.1.3'
  - '@ai-markdown/rehype-raw@7.0.3'

# This file is the ONLY place pnpm reads settings from (11.x behavior). The
# root package.json used to carry a `pnpm.overrides` block for pnpm 10; it is
# gone, and `pnpm check:overrides` fails the build if one reappears, because
# pnpm 11 would ignore it without applying anything.
#
# Two rules that lived here before the pnpm 11 move and are deliberately NOT
# here now (this block had never actually taken effect under pnpm 10, so they
# had gone unexercised):
#
#   picomatch: ^4.0.4  — no advisory has ever been filed against picomatch in
#     this repo, and micromatch@4.0.8 / anymatch@3.1.3 declare `^2.3.1` /
#     `^2.0.4`. Forcing 4.x on them crosses two majors against their own
#     declared range, buying nothing.
#   typescript: ^6.0.3 — the unscoped form also rewrites packages that pin an
#     exact older TS (react-doctor pins 5.6.1-rc). Narrowed to `typescript@>=7`
#     below, which is what the intent was: keep TS 7 out, touch nothing else.
overrides:
  # Security floors. dompurify's is the surviving floor from alert #8
  # (GHSA-h7mw-gpvr-xq4m, < 3.4.0).
  dompurify: ^3.4.0
  uuid: ^11.1.1
  # Security fixes for comma parsing and attacker-controlled isBuffer.
  qs@<6.16.0: '>=6.16.0 <7'
  # Keep recursive-copy symlink handling within the patched 0.16 line.
  '@humanfs/node@>=0.16.0 <0.16.8': '>=0.16.8 <0.17'
  # Scoped CVE remediations. Bound BOTH ends: with a bare `>=x` the resolver
  # is free to take the next major. fast-uri did exactly that — `>=3.1.5`
  # pulled 4.1.2, outside the `^3.0.1` that its only consumer (ajv 8.x)
  # declares.
  #
  # Raised 2026-09-03 from `<3.1.5 -> >=3.1.5` to `<3.1.6 -> >=3.1.6`: four
  # further advisories landed whose range is `< 3.1.6`, so the version the
  # previous floor installed had itself become the vulnerable one. A floor
  # that names an exact version ages into a no-op the moment the next
  # advisory extends the range past it, and nothing here re-checks that on
  # its own — the alert is the only signal.
  fast-uri@>=3.0.0 <3.1.6: '>=3.1.6 <4'
  # GHSA prototype-write / crash, vulnerable `<= 4.28.6`, patched 4.28.7.
  # Dev-only: babel's `helper-compilation-targets` (via stryker) and
  # `update-browserslist-db`. Every dependent declares `^4.24.0`, so this
  # only collapses a duplicate rather than forcing anyone off their range.
  #
  # An override rather than a plain `pnpm update`, which was tried first and
  # is NOT enough: update guarantees a satisfying version exists, it does not
  # remove an older resolution that also satisfies. It installed 4.28.8 and
  # left 4.28.6 in the tree, alert still open, with a lockfile that reads as
  # fixed. The test is whether the OLD version is gone, not whether the new
  # one arrived.
  browserslist@<4.28.7: '>=4.28.7 <5'
  # Selector deliberately bounded below as well, so minimatch's 1.x/2.x
  # instances are not caught by it.
  # Include the follow-up fix for unbounded intermediate expansion arrays.
  brace-expansion@>=3.0.0 <5.0.9: '>=5.0.9 <6'
  # Dependabot #18 (GHSA dev-server file read, fixed in 0.28.1): the only
  # in-range holdout is dormant tsup's `esbuild: ^0.27.0` dependency —
  # every other dependent allows 0.28 (vite peers ^0.27 || ^0.28). Verified
  # empirically against tsup 8.5.1: dist output, "use client" preservation
  # and the full preflight are green under 0.28. Drop when tsup (or its
  # successor) declares ^0.28 itself. Bounded above like the others: esbuild
  # is 0.x (every minor is breaking) and an open range would let the next
  # lockfile re-resolution swap the verified 0.28 for an untested 0.29.
  esbuild@<0.28.1: '>=0.28.1 <0.29'
  # Keep the TS major out of 7: TS 7 has no programmatic JS API (arrives in
  # 7.1), which typescript-eslint and tsup's dts worker both require. The
  # exposure is autoInstallPeers grabbing the latest for tsup's optional peer
  # on lockfile re-resolution (e.g. a dependabot PR). TS 6's baseUrl
  # deprecation (TS5101, injected by tsup's dts worker) is waived via
  # ignoreDeprecations in tsconfig.base.json. Mirrors the dependabot policy
  # that locks typescript.
  typescript@>=7: ^6.0.3
  # Upstream declares `react-doctor: "latest"` (via react-scan), which floated
  # to a build-breaking version once. These pins are long-term defense, not
  # stale cruft — do not "clean up". Re-test before lifting.
  react-doctor: 0.8.1
  react-grab: 0.1.48

# Storybook 10.6 predates Vitest 5. Keep this exception scoped to the exact
# combination verified by both Storybook catalogs and the browser viewport
# migration in vitest.config.ts; do not accept future majors implicitly.
peerDependencyRules:
  allowedVersions:
    '@storybook/addon-vitest@10.6.0>vitest': '5.0.1'
    '@storybook/addon-vitest@10.6.0>@vitest/browser': '5.0.1'
    '@storybook/addon-vitest@10.6.0>@vitest/browser-playwright': '5.0.1'

# Vitest 5 joins suite/test names with " > ". Keep coverage IDs and mutant
# selection in sync until Stryker supports that separator upstream.
patchedDependencies:
  '@stryker-mutator/vitest-runner@9.6.1': patches/@stryker-mutator__vitest-runner@9.6.1.patch
